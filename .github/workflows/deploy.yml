name: Deploy FastAPI to AWS Lambda (S3)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt -t package --no-cache-dir
          cp -r auth routes services main.py models.py database.py package/
          find package -name "__pycache__" -type d -exec rm -rf {} +

      - name: Zip files
        run: |
          cd package
          zip -r ../function.zip . -x "*.pyc" -x "*__pycache__*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload ZIP to S3
        run: |
          aws s3 cp function.zip s3://${{ secrets.S3_BUCKET }}/function.zip

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
          --function-name dhana-durga-backend \
          --s3-bucket ${{ secrets.S3_BUCKET }} \
          --s3-key function.zip